<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIANA MOD - Dang Cap Nhat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a1a;
            color: #f0f0f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .wrap {
            text-align: center;
            padding: 40px 24px;
            max-width: 400px;
        }
        .icon {
            font-size: 3em;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.1); }
        }
        h1 {
            font-size: 1.4em;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #7c4dff, #ff4081);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: #8888aa;
            font-size: 0.95em;
            line-height: 1.6;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(124, 77, 255, 0.2);
            border-top-color: #7c4dff;
            border-radius: 50%;
            margin: 24px auto 0;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="icon">&#9881;</div>
        <h1>Web Dang Cap Nhat</h1>
        <p>He thong dang tai tai nguyen. Vui long quay lai sau vai phut.</p>
        <div class="spinner"></div>
    </div>
</body>
</html>
